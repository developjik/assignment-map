name: deploy
on:
  push:
    branches: [main]
    paths: ['web/**', 'data/**', 'scripts/**', 'collector/golden_cases.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync-readme:
    # README '숫자' 표를 data/*.json 실측으로 다시 쓴다(정의: scripts/sync-readme.mjs).
    # 바뀌면 봇이 커밋한다. GITHUB_TOKEN 푸시는 deploy 를 다시 트리거하지 않아 무한루프가 없다.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: README 수치 동기화
        run: node scripts/sync-readme.mjs
      - name: 바뀐 게 있으면 커밋·푸시
        run: |
          set -eu
          if git diff --quiet -- README.md; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): sync numbers from data"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: web
      - name: Build (slop-lint 게이트 포함)
        run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
