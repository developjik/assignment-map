name: watchdog
# Aside 루틴(매일 03:00 KST)이 data/meta.json의 last_run을 갱신하는지 감시.
# 마지막 수집이 2일 이상 지났으면 이슈를 열어 오너에게 이메일 알림. (Aside가 죽었을 때의 제3자 감시)
# 이슈 본문에 collector/watchdog.mjs 자동 진단(검증 잠금·push 이탈·소스 차단·루틴 미도착)을 붙이고,
# 이미 열린 이슈가 있으면 매일 진단을 댓글로 갱신한다(DEV-115).
on:
  schedule:
    - cron: "30 19 * * *"   # 04:30 KST — 03:00 루틴 종료 예상 시각 + 30분
  workflow_dispatch:

permissions:
  issues: write
  contents: read
  actions: read             # fetch-candidates 실행 결과 조회(진단)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0     # 진단: 마지막 루틴 커밋 이후 이력 + 원격 브랜치 전부
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Check last_run freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          LAST_RUN="$(python3 -c "import json;print(json.load(open('data/meta.json')).get('last_run') or '')")"
          if [ -z "$LAST_RUN" ]; then
            echo "::error::meta.json 조회 실패 또는 last_run 없음"
            exit 1
          fi

          # last_run 은 날짜(YYYY-MM-DD)다. 러너 시간대(UTC)에 휘둘리지 않게 KST 달력일 차이로 센다.
          DAYS="$(python3 -c 'import sys,datetime as d; kst=d.timezone(d.timedelta(hours=9)); last=d.datetime.strptime(sys.argv[1],"%Y-%m-%d").replace(tzinfo=kst); today=d.datetime.now(kst).replace(hour=0,minute=0,second=0,microsecond=0); print((today-last).days)' "$LAST_RUN")"
          echo "last_run=$LAST_RUN age=${DAYS}d (KST 달력일 기준)"

          # 제목에 watchdog 이 들어간 열린 이슈 수 (검색어는 리터럴, 대괄호 없이)
          OPEN_COUNT="$(gh issue list --repo "$REPO" --state open --search 'in:title watchdog' \
            --json number --jq 'length')"

          if [ "$DAYS" -ge 2 ]; then
            gh run list --repo "$REPO" --workflow fetch-candidates.yml -L 3 \
              --json conclusion,createdAt,status > "$RUNNER_TEMP/coldscan-runs.json" \
              || echo '[]' > "$RUNNER_TEMP/coldscan-runs.json"
            DIAG="$(node collector/watchdog.mjs --runs "$RUNNER_TEMP/coldscan-runs.json" \
              || echo '자동 진단 실패 — Actions 로그 참고')"
            echo "$DIAG"
            if [ "$OPEN_COUNT" -eq 0 ]; then
              gh issue create --repo "$REPO" \
                --title "[watchdog] 수집 지연: last_run=${LAST_RUN} (${DAYS}일 경과)" \
                --body "$(printf '%s\n' \
                  "Aside 루틴이 data/meta.json을 2일 이상 갱신하지 않았습니다." \
                  "" \
                  "- last_run: ${LAST_RUN} (경과 ${DAYS}일)" \
                  "- 확인: 맥북 꺼짐 / Aside 세션 실패 / 소스 차단 / push 실패" \
                  "- 수집이 재개되면 다음 런에서 이 이슈를 자동으로 닫습니다." \
                  "" \
                  "$DIAG")"
            else
              echo "이미 열린 watchdog 이슈가 있습니다 (${OPEN_COUNT}건) — 진단을 댓글로 갱신한다."
              N="$(gh issue list --repo "$REPO" --state open --search 'in:title watchdog' \
                --json number --jq '.[0].number')"
              gh issue comment "$N" --repo "$REPO" \
                --body "$(printf '%s\n' "여전히 지연: last_run=${LAST_RUN} (경과 ${DAYS}일)" "" "$DIAG")"
            fi
            echo "::warning::stale last_run (${DAYS}d)"
          else
            echo "OK — fresh (${DAYS}d)"
            if [ "$OPEN_COUNT" -gt 0 ]; then
              gh issue list --repo "$REPO" --state open --search 'in:title watchdog' \
                --json number --jq '.[].number' | while read -r N; do
                  gh issue close "$N" --repo "$REPO" \
                    --comment "수집이 재개되었습니다 (last_run=${LAST_RUN}). 자동으로 닫습니다."
                done
            fi
          fi
