name: watchdog
# Aside 루틴(매일 03:00 KST)이 data/meta.json의 last_run을 갱신하는지 감시.
# 26시간 이상 무갱신이면 이슈를 열어 오너에게 이메일 알림. (Aside가 죽었을 때의 제3자 감시)
on:
  schedule:
    - cron: "30 19 * * *"   # 04:30 KST — 03:00 루틴 종료 예상 시각 + 30분
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check last_run freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          META_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/data/meta.json"
          LAST_RUN=$(curl -sf "$META_URL" | python3 -c "import sys,json;print(json.load(sys.stdin).get('last_run') or '')")
          if [ -z "$LAST_RUN" ]; then
            echo "::error::meta.json 조회 실패 또는 last_run 없음"
            exit 1
          fi
          AGE_H=$(( ( $(date +%s) - $(date -j -f "%Y-%m-%d" "$LAST_RUN" +%s) ) / 3600 ))
          echo "last_run=$LAST_RUN age=${AGE_H}h (기준일 ${LAST_RUN}T03:00+09:00 가정)"
          if [ "$AGE_H" -ge 26 ]; then
            TITLE="[watchdog] 수집 지연: last_run=${LAST_RUN} (${AGE_H}h+)"
            if ! gh issue list --state open --search "in:title [watchdog]" | grep -q watchdog; then
              gh issue create --title "$TITLE" --body "Aside 루틴이 data/meta.json을 26시간 이상 갱신하지 않았습니다.
          - last_run: ${LAST_RUN} (경과 ${AGE_H}h)
          - 확인: 맥북 꺼짐 / Aside 세션 실패 / 소스 차단 / push 실패
          - 원인 해결 후 이 이슈를 닫으면 다음 런부터 정상 감시됩니다." || true
            fi
            echo "::warning::stale last_run"
          else
            echo "OK — fresh (${AGE_H}h)"
          fi
